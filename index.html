<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2367d5b2'/%3E%3Ctext%20x='16'%20y='23'%20font-family='system-ui'%20font-size='20'%20font-weight='800'%20text-anchor='middle'%20fill='%2306201a'%3EK%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Kestrel</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kestrel.theme");
          if (stored !== "light" && stored !== "dark" && stored !== "auto") {
            stored = "auto";
          }
          var resolved = stored;
          if (stored === "auto") {
            resolved =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
