[package]
name = "argus"
version = "0.1.0"
description = "Argus Workstation - All-in-one Linux utility"
authors = ["Trevor"]
edition = "2024"

[lib]
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
libc = "0.2"
tauri-plugin-dialog = "2.8.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
